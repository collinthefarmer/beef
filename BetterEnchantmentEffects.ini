[General]
; Apply to the player only, not loaded NPCs.
PlayerOnly=false
; Master switch.
EnableShaders=true
; Drive the normal actor model.
ThirdPerson=true
; Drive the player's first-person arms.
FirstPerson=true
; Give each worn clone its own copy of the pooled PBR material before writing to it.
UniqueMaterial=true
; Apply the recipes in the recipes/debug folder. When off, they stay in the editor but match no armor.
ShowDebugRecipes=false
; Add detail lines to the log: the pieces, recipes, lights and geometries of each apply, resolution changes, retirements, mesh and material reads, render-target bursts, and armor without PBR geometry. Each mesh read also compares its CPU copy with a GPU readback. Faults and the one-line apply summary are logged either way.
VerboseLogging=false
; Write bounded transition and resource events to a unique JSONL log.
DiagnosticLogging=true
; Time the plugin's GPU work per render tick and write the totals to the diagnostic trace.
GpuTiming=false
; Show the rendered effects on materials and shells. When off, effects still render but the original materials stay.
PublishEffects=true
; Draw recipe programs and stacks with shaders compiled for each one instead of the shared interpreter.
GeneratedShaders=true
; Reuse an actor's render plan for every actor whose effects need the same plan.
RenderPlanCache=true
; Build every reused render plan again and log any difference. For testing; it removes the cache's saving.
VerifyRenderPlanCache=false
; Leave the effects of an NPC outside the camera's view as they are until it comes back into view. Reflections of such an NPC show its last frame.
CullOutOfView=true
; Draw an NPC's effects at a lower resolution when it covers a small part of the screen. The player always draws at full resolution.
ScreenResolution=true
; The most memory in MiB that the effects' render targets may use. The plugin also stays inside the free video memory. 0 sets no limit of its own.
RenderTargetBudgetMiB=0
; Animation update rate.
AnimationFPS=60
; Time multiplier for the EFSH animation.
AnimationSpeed=1
; Runtime texture resolution relative to the armor's own maps.
TextureScale=Full
; Game units past which a non-player actor's effects are dropped and restored on approach; 0 disables eviction.
EvictDistance=0
