[General]
; Apply to loaded NPCs as well as the player.
PlayerOnly=false

; Master switch for driving PBR emissive from enchantment visuals.
EnableShaders=true

; Third person covers the normal actor model. First person is player-only.
ThirdPerson=true
FirstPerson=true

; Give each worn clone its own copy of the PBR material before writing to it.
; CS pools materials by content, so with this off every actor sharing a
; material glows when one of them does. Turn off only to test that behaviour.
UniqueMaterial=true

; Safety ceiling for unusual multi-slot armor. 1..256.
MaxEffectsPerActor=32

; Animation update rate (15..60) and multipliers. Speed 0.05..4.0, intensity 0.1..2.0.
AnimationFPS=60
AnimationSpeed=1.0
Intensity=1.0

; Multiplier from EFSH fill alpha to emissive strength. Vanilla armor enchant
; shaders use fill alpha 0.05..0.10 with grey fill colours, so 1.0 is invisible.
EmissiveScale=20.0

; Normalised mode: every record glows at EmissiveStrength (for a texture of mean
; luminance 0.5), modulated only by its own pulse and fade; hue still comes from
; the record. Off = raw EFSH values x EmissiveScale, which makes black-fill
; records (stamina, frost) far brighter than grey-fill ones.
NormalizeBrightness=true
EmissiveStrength=1.0

; One line per geometry on apply, plus restore and ownership diagnostics.
VerboseLogging=true

[Colors]
; Vanilla armor enchant shaders keep their colour in the edge (rim) effect and
; use grey or black fill keys. With TintWithEdge the emissive takes the edge
; hue and the fill brightness; BlackFillAsWhite lifts black fill keys so the
; stamina and frost shaders show at all. Records whose colour comes from a
; palette (fire) get it baked into their frames instead (make_flipbook.py --palette).
TintWithEdge=true
BlackFillAsWhite=true
; Per-record overrides: <plugin stem>~<local form id hex> = r,g,b (0..1 or 0..255).
; The key for a record is printed in its apply line as "efsh XXXXXXXX (key)".
; skyrim~092dee=0.3,1.0,0.4

[Runtime]
; Generate layer textures on the GPU each tick: exact per-pixel scroll, no frame
; folders, and the extra layers below. Off, or on failure, falls back to the
; Textures/WornEnchantmentPBR frame folders.
RuntimeTextures=true
RuntimeTextureSize=512

[Layers]
; Glow mask: multiply the glow per texel by one channel of the armor's RMAOS
; (0 roughness, 1 metallic, 2 occlusion, 3 reflectance), rendered per
; geometry. Threshold 0 uses the channel as is; above 0, on where the channel
; exceeds it with a soft edge of Softness. Strength 0..1 fades the mask in.
GlowMask=true
GlowMaskChannel=1
GlowMaskThreshold=0.0
GlowMaskSoftness=0.1
GlowMaskInvert=false
GlowMaskStrength=1.0
; Scrolling fuzz map (per-texel sheen) and scrolling displacement map (parallax
; shimmer). Both need RuntimeTextures. Mirror/transpose make the layer run
; against or across the glow; phase offsets it. Shimmer needs CS parallax on.
SheenMap=true
SheenMapMirror=true
SheenMapPhase=0.5
Shimmer=true
ShimmerScale=0.1
ShimmerTranspose=true
ShimmerPhase=0.25
; Height = armor relief (its own displacement map, else RMAOS occlusion) x ArmorWeight
; + scrolling noise x NoiseWeight. Armor relief makes the parallax follow the piece's real depth.
; 0 auto (displacement map, else RMAOS occlusion), 1 displacement, 2 occlusion, 3 normal slope, 4 diffuse luminance
ShimmerDepthSource=0
ShimmerArmorWeight=1.0
; Stretches the relief around its mean; occlusion maps sit near white and need it.
ShimmerReliefContrast=3.0
ShimmerNoiseWeight=0.35
; Gloss layer: the armor's RMAOS re-rendered with roughness lowered by GlossBoost
; where the scrolling noise is bright; contrast sharpens the patches. Keeps the
; armor's resolution up to GlossMapSize. Off = uniform roughness scale instead.
GlossMap=true
GlossMapMirror=false
GlossMapTranspose=false
GlossMapPhase=0.0
GlossContrast=2.0
GlossMapSize=1024
; Sheen: the EFSH edge effect drives CS's fuzz layer (coloured microflake
; specular plus ambient tint), a rim-like coloured glow. SheenScale multiplies
; the edge alpha (vanilla 0.4..0.9) into the fuzz weight (0..1).
Sheen=true
SheenScale=0.5
; Roughness reduction while enchanted (0 = off, 1 = mirror); follows the fill pulse.
GlossBoost=0.25
; Sparkle via CS glints. Mutually exclusive with Sheen (Sheen wins); changes
; the shader technique, so expect a one-time shader compile.
Glint=false
GlintScreenSpaceScale=1.5
GlintLogMicrofacetDensity=20
GlintMicrofacetRoughness=0.015
GlintDensityRandomization=2.0

[Outputs]
; Spike outputs outside the material. Light: a point light on the wearer's
; skeleton (third person only), hue from the effect, brightness from its pulse.
Light=true
LightIntensity=1.0
LightRadius=300
; 0 = the bones the item is skinned to (up to LightMaxPerEffect, weighted by
; vertex count, placed at each bone's skinned centre when LightUseBound is on);
; 1 spine (chest), 2 spine (base), 3 pelvis, 4 head, 5 root
LightBone=0
LightMaxPerEffect=2
LightUseBound=true
; Shell: a clone of each driven geometry with a vanilla rim-lit material,
; blended over the armor (0 additive, 1 alpha blend). Diffuse 0 = white,
; 1 = the armor's own diffuse. Rim and emissive are multiplied by the diffuse.
Shell=true
; 0 rim shell over the layer-driven armor; 1 the shell gets a private PBR copy
; that the glow/sheen/shimmer/gloss layers write, and the armor is untouched.
ShellMode=0
; Decal flag on the shell (depth bias against the armor). Off relies on inflation.
ShellDepthBias=true
ShellBlend=0
ShellDiffuse=0
ShellAlpha=0.5
ShellRimPower=4.0
ShellEmissive=0.5
; Inflation of the shell in percent: rest value plus a pulse term, so the
; shell breathes with the effect. Applied per bone in bone space, weighted per
; axis: X runs along the bone, Y and Z across it (0..1 each).
ShellScale=1.0
ShellScalePulse=1.0
ShellScaleAlong=0.0
ShellScaleAcrossY=1.0
ShellScaleAcrossZ=1.0
